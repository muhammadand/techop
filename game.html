<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Techop.id - Jasa Web Developer Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="bg-white">
    <!-- Loading indicator -->
    <div id="loading" class="text-center py-10">
      <div class="loading"></div>
      <p>Loading components...</p>
    </div>

    <!-- Containers untuk setiap komponen -->
    <div id="navbar-container"></div>
    <div id="hero-container"></div>
    <div id="technology-container"></div>
    <div id="services-container"></div>
    <div id="about-container"></div>
    <div id="portfolio-container"></div>
    <div id="pricing-container"></div>
    <div id="timeline-container"></div>
    <div id="team-container"></div>
    <div id="footer-container"></div>

    <script src="assets/js/script.js"></script>

    <script>
      // Data komponen yang akan di-load
      const components = [
        { name: "navbar", container: "navbar-container" },
        { name: "hero", container: "hero-container" },
        { name: "services", container: "services-container" },
        { name: "about", container: "about-container" },
        { name: "portfolio", container: "portfolio-container" },
        { name: "technology", container: "technology-container" },
        { name: "pricing", container: "pricing-container" },
        { name: "timeline", container: "timeline-container" },
        { name: "team", container: "team-container" },
        { name: "footer", container: "footer-container" },
      ];

      // Fungsi untuk load komponen dari folder 'game'
      async function loadComponent(componentName, containerId) {
        try {
          const response = await fetch(`game/${componentName}.html`);
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const html = await response.text();
          document.getElementById(containerId).innerHTML = html;
          console.log(`✅ ${componentName} loaded successfully`);
        } catch (error) {
          console.error(`❌ Error loading ${componentName}:`, error);
          // Fallback content jika gagal load
          document.getElementById(containerId).innerHTML = `
            <div class="text-center text-red-500 p-4">
                Error loading ${componentName} component
            </div>
          `;
        }
      }

      // Fungsi untuk load semua komponen
      async function loadAllComponents() {
        console.log("🚀 Starting to load components...");

        const loadPromises = components.map((comp) => loadComponent(comp.name, comp.container));

        try {
          await Promise.all(loadPromises);
          console.log("✅ All components loaded!");

          // Hide loading indicator
          document.getElementById("loading").style.display = "none";

          // Initialize event listeners setelah semua komponen loaded
          setTimeout(initializeEventListeners, 100);
        } catch (error) {
          console.error("❌ Error loading components:", error);
          document.getElementById("loading").innerHTML = `
            <div class="text-red-500">
              <p>❌ Error loading components</p>
              <p class="text-sm">${error.message}</p>
            </div>
          `;
        }
      }

      // Fungsi untuk inisialisasi event listeners
      function initializeEventListeners() {
        console.log("🎯 Initializing event listeners...");

        // Mobile menu toggle
        const navToggle = document.getElementById("navToggle");
        const mobileMenu = document.getElementById("mobileMenu");

        if (navToggle && mobileMenu) {
          navToggle.addEventListener("click", function () {
            mobileMenu.classList.toggle("hidden");
            console.log("📱 Mobile menu toggled");
          });
        }

        // Auto-scroll untuk technology section
        const container = document.getElementById("auto-scroll-container");
        if (container) {
          let scrollDirection = 1;
          const scrollSpeed = 1;

          function autoScroll() {
            container.scrollLeft += scrollDirection * scrollSpeed;

            if (container.scrollLeft + container.clientWidth >= container.scrollWidth) {
              scrollDirection = -1;
            }
            if (container.scrollLeft <= 0) {
              scrollDirection = 1;
            }
            requestAnimationFrame(autoScroll);
          }
          autoScroll();
          console.log("🔄 Auto-scroll initialized");
        }

        // Smooth scrolling untuk navigation links
        document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
          anchor.addEventListener("click", function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute("href"));
            if (target) {
              target.scrollIntoView({
                behavior: "smooth",
              });
            }
          });
        });

        console.log("✅ Event listeners initialized!");
      }

      // Load components ketika DOM ready
      document.addEventListener("DOMContentLoaded", function () {
        console.log("📄 DOM loaded, starting component loading...");
        loadAllComponents();
      });

      // Fallback jika ada error pada window load
      window.addEventListener("load", function () {
        setTimeout(() => {
          const loading = document.getElementById("loading");
          if (loading && loading.style.display !== "none") {
            loading.innerHTML = `
              <div class="text-center text-amber-600 p-4">
                  <p>⚠️ Components are taking longer to load</p>
                  <p class="text-sm">Please check if game folder exists and contains HTML files</p>
                  <button onclick="location.reload()" class="mt-2 px-4 py-2 bg-blue-600 text-white rounded">
                      Retry
                  </button>
              </div>
            `;
          }
        }, 5000);
      });
    </script>
  </body>
</html>
