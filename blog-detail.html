        // Get category color class
        function getCategoryColorClass(categoryColor) {
            const colorClasses = {
                blue: "bg-blue-500",
                green: "bg-green-500",
                purple: "bg-purple-500",
                orange: "bg-orange-500",
                indigo: "bg-indigo-500",
                teal: "bg-teal-500",
                pink: "bg-pink-500",
            };
            return colorClasses[categoryColor] || "bg-blue-500";
        }

        // Get category icon
        function getCategoryIcon(category) {
            const icons = {
                Teknologi: "fas fa-laptop-code",
                "Tips & Tricks": "fas fa-lightbulb",
                "Tren Digital": "fas fa-chart-line",
                "Case Study": "fas fa-clipboard-check",
            };
            return icons[category] || "fas fa-newspaper";
        }

        // Load article from URL parameter
        function loadArticle() {
            const loading = document.getElementById('loading');
            const articleNotFound = document.getElementById('articleNotFound');
            const articleContent = document.getElementById('articleContent');

            // Show loading
            loading.style.display = 'block';
            articleNotFound.style.display = 'none';
            articleContent.style.display = 'none';

            // Get article ID from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            console.log('Loading article:', articleId);

            // Check if article exists
            if (!articleId || !blogArticlesData[articleId]) {
                console.log('Article not found:', articleId);
                loading.style.display = 'none';
                articleNotFound.style.display = 'block';
                return;
            }

            const article = blogArticlesData[articleId];
            console.log('Article found:', article.title);

            // Update page title
            document.title = `${article.title} - TechOp`;

            // Populate article data
            document.getElementById('articleCategory').textContent = article.category;
            document.getElementById('articleCategory').className = `${getCategoryColorClass(article.categoryColor)} text-white text-sm font-semibold px-3 py-2 rounded-full`;
            document.getElementById('articleReadTime').querySelector('span').textContent = article.readTime;
            document.getElementById('articleTitle').textContent = article.title;
            document.getElementById('articleExcerpt').textContent = article.excerpt;
            document.getElementById('articleAuthorAvatar').querySelector('span').textContent = article.authorAvatar;
            document.getElementById('articleAuthor').textContent = article.author;
            document.getElementById('articleDate').textContent = article.date;
            document.getElementById('articleViews').querySelector('span').textContent = article.views;
            document.getElementById('articleLikes').querySelector('span').textContent = article.likes;

            // Update featured image
            const featuredImageContainer = document.getElementById('articleFeaturedImage');
            featuredImageContainer.innerHTML = `
                <div class="relative h-64 md:h-80">
                    <img src="${article.featuredImage}" alt="${article.title}" class="w-full h-full object-cover rounded-lg">
                    <div class="absolute inset-0 bg-black bg-opacity-30 rounded-lg flex items-center justify-center">
                        <div class="text-center text-white">
                            <i class="${getCategoryIcon(article.category)} text-4xl mb-2 opacity-80"></i>
                            <p class="text-sm font-medium opacity-80">${article.category}</p>
                        </div>
                    </div>
                </div>
            `;

            // Update article body
            document.getElementById('articleBody').innerHTML = article.content;

            // Update tags
            const tagsContainer = document.getElementById('articleTags');
            tagsContainer.innerHTML = '';
            article.tags.forEach((tag) => {
                const tagElement = document.createElement('span');
                tagElement.className = 'bg-gray-100 text-gray-700 px-3 py-2 rounded-full text-sm hover:bg-gray-200 transition-colors';
                tagElement.textContent = tag;
                tagsContainer.appendChild(tagElement);
            });

            // Update related articles
            const relatedContainer = document.getElementById('articleRelated');
            relatedContainer.innerHTML = '';
            article.relatedArticles.forEach((relatedId) => {
                const relatedArticle = blogArticlesData[relatedId];
                if (relatedArticle) {
                    const relatedElement = document.createElement('div');
                    relatedElement.className = 'bg-gray-50 p-4 rounded-lg hover:bg-gray-100 cursor-pointer transition-colors border border-gray-200 hover:shadow-md';
                    relatedElement.innerHTML = `
                        <h5 class="font-semibold text-gray-900 mb-2 hover:text-blue-600 transition-colors">${relatedArticle.title}</h5>
                        <p class="text-sm text-gray-600 mb-3 leading-relaxed">${relatedArticle.excerpt.substring(0, 120)}...</p>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2 text-xs text-gray-500">
                                <span>${relatedArticle.author}</span>
                                <span>•</span>
                                <span>${relatedArticle.date}</span>
                            </div>
                            <span class="text-xs ${getCategoryColorClass(relatedArticle.categoryColor).replace('bg-', 'bg-').replace('-500', '-100')} ${getCategoryColorClass(relatedArticle.categoryColor).replace('bg-', 'text-').replace('-500', '-600')} px-2 py-1 rounded-full">${relatedArticle.category}</span>
                        </div>
                    `;
                    relatedElement.addEventListener('click', () => {
                        window.location.href = `blog-detail.html?id=${relatedId}`;
                    });
                    relatedContainer.appendChild(relatedElement);
                }
            });

            // Update like count
            document.querySelector('.like-count').textContent = article.likes;

            // Hide loading and show content
            loading.style.display = 'none';
            articleContent.style.display = 'block';

            // Smooth scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Social sharing functionality
        function shareArticle(platform, title, url) {
            switch (platform) {
                case 'facebook':
                    window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, '_blank');
                    break;
                case 'twitter':
                    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`, '_blank');
                    break;
                case 'linkedin':
                    window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`, '_blank');
                    break;
                case 'whatsapp':
                    window.open(`https://wa.me/?text=${encodeURIComponent(title + ' ' + url)}`, '_blank');
                    break;
            }
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, loading article...');
            loadArticle();

            // Social share buttons
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('share-btn') || e.target.closest('.share-btn')) {
                    e.preventDefault();
                    const button = e.target.classList.contains('share-btn') ? e.target : e.target.closest('.share-btn');
                    const platform = button.getAttribute('data-platform');
                    const urlParams = new URLSearchParams(window.location.search);
                    const articleId = urlParams.get('id');
                    const article = blogArticlesData[articleId];
                    
                    if (article) {
                        shareArticle(platform, article.title, window.location.href);
                    }
                }
            });

            // Like button functionality
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('like-btn') || e.target.closest('.like-btn')) {
                    e.preventDefault();
                    const button = e.target.classList.contains('like-btn') ? e.target : e.target.closest('.like-btn');
                    const likeIcon = button.querySelector('i');
                    const likeCount = button.querySelector('.like-count');

                    if (likeIcon.classList.contains('far')) {
                        // Like the article
                        likeIcon.classList.remove('far');
                        likeIcon.classList.add('fas');
                        likeCount.textContent = parseInt(likeCount.textContent) + 1;
                        button.classList.add('text-red-500');
                    } else {
                        // Unlike the article
                        likeIcon.classList.remove('fas');
                        likeIcon.classList.add('far');
                        likeCount.textContent = parseInt(likeCount.textContent) - 1;
                        button.classList.remove('text-red-500');
                    }
                }
            });

            // Share article button
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('share-article-btn') || e.target.closest('.share-article-btn')) {
                    e.preventDefault();
                    const urlParams = new URLSearchParams(window.location.search);
                    const articleId = urlParams.get('id');
                    const article = blogArticlesData[articleId];
                    
                    if (article) {
                        if (navigator.share) {
                            navigator.share({
                                title: article.title,
                                url: window.location.href,
                            });
                        } else {
                            // Fallback: copy to clipboard
                            navigator.clipboard.writeText(window.location.href).then(() => {
                                alert('Link artikel berhasil disalin!');
                            });
                        }
                    }
                }
            });
        });
    </script>
